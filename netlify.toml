[build]
  command = "npm run build"
  publish = "public"
[build.environment]
  NODE_VERSION = "24"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' http://192.168.3.83:8123"
    Cache-Control = "no-cache"
